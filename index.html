<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EUTHLE | Premium Digital Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== THEME COLORS ===== */
:root {
  --g:#00ff88;--g2:#00e676;--g3:#00c853;
  --dark:#020c07;--card:rgba(0,255,136,0.04);--border:rgba(0,255,136,0.12);
  --dim:#5a8a6a;--orb1c:rgba(0,255,136,0.07);--orb2c:rgba(0,200,83,0.06);
  --glass:rgba(2,15,9,0.85);--glass2:rgba(0,255,136,0.04);
  --radius:20px;--radius-sm:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--dark);color:#fff;font-family:'Syne',sans-serif;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--dark);}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--g),var(--g3));border-radius:10px;}

/* ===== LOADER ===== */
#loader{position:fixed;inset:0;background:var(--dark);z-index:99999;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 1s ease,visibility 1s ease;}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none;}
.ld-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,255,136,0.06) 0%,transparent 65%);animation:ldBgPulse 2s ease infinite;}
@keyframes ldBgPulse{0%,100%{opacity:.5;}50%{opacity:1;}}
.ld-name{font-family:'Orbitron',monospace;font-size:clamp(34px,9vw,72px);font-weight:900;letter-spacing:clamp(5px,2.5vw,18px);background:linear-gradient(90deg,var(--g),var(--g3),var(--g));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 1.8s linear infinite;position:relative;z-index:1;}
@keyframes shimmer{0%{background-position:0%;}100%{background-position:200%;}}
.ld-tagline{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:5px;text-transform:uppercase;margin-top:10px;margin-bottom:30px;position:relative;z-index:1;}
.ld-bar-wrap{width:200px;height:2px;background:rgba(0,255,136,0.1);border-radius:10px;overflow:hidden;position:relative;z-index:1;}
.ld-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--g),var(--g3));animation:ldFill 2s cubic-bezier(.4,0,.2,1) forwards;box-shadow:0 0 10px var(--g);}
@keyframes ldFill{0%{width:0%;}100%{width:100%;}}
.ld-pct{font-family:'Space Mono',monospace;font-size:11px;color:var(--g);margin-top:10px;position:relative;z-index:1;}
.ld-scanline{position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,rgba(0,255,136,0.4),transparent);animation:scan 2s linear infinite;}
@keyframes scan{0%{top:-10px;}100%{top:100%;}}

/* ===== BACKGROUND ===== */
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 10% 20%,rgba(0,255,136,0.07) 0%,transparent 45%),radial-gradient(ellipse at 90% 80%,rgba(0,200,83,0.06) 0%,transparent 40%),var(--dark);z-index:-10;}
.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:-9;pointer-events:none;}
.orb1{width:500px;height:500px;background:var(--orb1c);top:-150px;left:-150px;animation:o1 12s ease infinite alternate;}
.orb2{width:400px;height:400px;background:var(--orb2c);bottom:-150px;right:-150px;animation:o2 14s ease infinite alternate;}
@keyframes o1{from{transform:translate(0,0);}to{transform:translate(80px,100px);}}
@keyframes o2{from{transform:translate(0,0);}to{transform:translate(-80px,-80px);}}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,136,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.025) 1px,transparent 1px);background-size:55px 55px;z-index:-8;}

/* ===== HEADER ===== */
header{position:fixed;top:0;left:0;width:100%;padding:12px 4%;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);background:rgba(2,12,7,0.65);border-bottom:1px solid rgba(0,255,136,0.08);z-index:999;gap:8px;transition:.3s;}
.logo{font-family:'Orbitron',monospace;font-size:clamp(14px,3vw,20px);font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,var(--g),var(--g3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;flex-shrink:0;cursor:pointer;}
nav{display:flex;gap:22px;align-items:center;}
nav a{color:var(--dim);text-decoration:none;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;transition:.3s;position:relative;}
nav a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--g);transition:.3s;}
nav a:hover{color:var(--g);}nav a:hover::after{width:100%;}
.hire-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:50px;background:linear-gradient(135deg,rgba(0,255,136,0.15),rgba(0,200,83,0.08));border:1px solid rgba(0,255,136,0.3);font-size:11px;font-weight:800;color:var(--g);letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.4s;text-decoration:none;}
.hire-pill:hover{background:rgba(0,255,136,0.2);box-shadow:0 0 24px rgba(0,255,136,0.25);transform:translateY(-2px);}
.hire-dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);animation:dotBlink 1.5s ease infinite;}
@keyframes dotBlink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.6);}}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.menu-btn{display:none;font-size:20px;cursor:pointer;color:var(--g);padding:4px;background:rgba(0,255,136,0.06);border:1px solid rgba(0,255,136,0.18);border-radius:8px;width:36px;height:36px;align-items:center;justify-content:center;}

/* ===== MUSIC BTN ===== */
.music-btn{width:36px;height:36px;border-radius:50%;background:rgba(0,255,136,0.06);border:1px solid rgba(0,255,136,0.2);display:flex;justify-content:center;align-items:center;cursor:pointer;transition:.4s;color:var(--dim);font-size:13px;flex-shrink:0;}
.music-btn.playing{color:var(--g);border-color:rgba(0,255,136,0.4);background:rgba(0,255,136,0.1);animation:musicPulse 1.5s ease infinite;}
.music-btn:hover{color:var(--g);border-color:rgba(0,255,136,0.35);background:rgba(0,255,136,0.08);}
@keyframes musicPulse{0%,100%{box-shadow:0 0 8px rgba(0,255,136,0.2);}50%{box-shadow:0 0 22px rgba(0,255,136,0.45);}}
.music-bars{display:none;align-items:flex-end;gap:2px;height:13px;}
.music-btn.playing .music-bars{display:flex;}
.music-btn.playing .music-icon{display:none;}
.music-bar{width:3px;background:var(--g);border-radius:2px;}
.music-bar:nth-child(1){animation:bar1 .6s ease infinite;}
.music-bar:nth-child(2){animation:bar2 .8s ease infinite .1s;}
.music-bar:nth-child(3){animation:bar1 .7s ease infinite .2s;}
@keyframes bar1{0%,100%{height:4px;}50%{height:13px;}}
@keyframes bar2{0%,100%{height:11px;}50%{height:4px;}}

/* ===== MUSIC PLAYER PANEL ===== */
.music-panel-wrap{position:relative;flex-shrink:0;}
.music-panel{position:absolute;top:calc(100% + 12px);left:0;width:300px;background:rgba(2,10,5,0.97);border:1px solid rgba(0,255,136,0.18);border-radius:20px;padding:20px;backdrop-filter:blur(28px);box-shadow:0 24px 70px rgba(0,0,0,0.8),0 0 24px rgba(0,255,136,0.06);z-index:1200;opacity:0;visibility:hidden;transform:translateY(-10px) scale(.97);transition:.28s cubic-bezier(.25,.46,.45,.94);pointer-events:none;}
.music-panel.open{opacity:1;visibility:visible;transform:translateY(0) scale(1);pointer-events:all;}
.mp-now{display:flex;align-items:center;gap:11px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(0,255,136,0.08);}
.mp-disc{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--g3));display:flex;justify-content:center;align-items:center;flex-shrink:0;font-size:16px;color:#020c07;position:relative;}
.mp-disc.spinning{animation:spin 3s linear infinite;}
@keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
.mp-disc-hole{width:9px;height:9px;border-radius:50%;background:var(--dark);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.mp-info{flex:1;min-width:0;}
.mp-title{font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.mp-artist{font-size:10px;color:var(--dim);font-family:'Space Mono',monospace;}
.mp-label{font-size:8px;color:var(--g);letter-spacing:3px;font-family:'Space Mono',monospace;text-transform:uppercase;margin-bottom:4px;}
.mp-progress-wrap{margin-bottom:12px;}
.mp-progress-bar{width:100%;height:3px;background:rgba(0,255,136,0.1);border-radius:10px;cursor:pointer;position:relative;overflow:hidden;}
.mp-progress-fill{height:100%;background:linear-gradient(90deg,var(--g),var(--g3));border-radius:10px;width:0%;transition:width .5s linear;box-shadow:0 0 6px rgba(0,255,136,0.4);}
.mp-times{display:flex;justify-content:space-between;margin-top:5px;font-size:9px;font-family:'Space Mono',monospace;color:var(--dim);}
.mp-controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;}
.mp-ctrl-btn{width:32px;height:32px;border-radius:50%;background:rgba(0,255,136,0.05);border:1px solid rgba(0,255,136,0.12);display:flex;justify-content:center;align-items:center;cursor:pointer;color:var(--dim);font-size:12px;transition:.3s;}
.mp-ctrl-btn:hover{background:rgba(0,255,136,0.1);border-color:rgba(0,255,136,0.3);color:var(--g);}
.mp-play-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--g3));border:none;display:flex;justify-content:center;align-items:center;cursor:pointer;color:#020c07;font-size:15px;transition:.3s;box-shadow:0 0 18px rgba(0,255,136,0.25);}
.mp-play-btn:hover{transform:scale(1.1);box-shadow:0 0 30px rgba(0,255,136,0.45);}
.mp-ctrl-btn.active{color:var(--g);border-color:rgba(0,255,136,0.3);}
.mp-vol-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.mp-vol-icon{color:var(--dim);font-size:11px;width:14px;text-align:center;}
.mp-vol-slider{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:10px;background:rgba(0,255,136,0.1);outline:none;cursor:pointer;}
.mp-vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--g);cursor:pointer;box-shadow:0 0 6px rgba(0,255,136,0.5);}
.mp-playlist-label{font-family:'Space Mono',monospace;font-size:8px;color:var(--dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;}
.mp-playlist{max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.mp-playlist::-webkit-scrollbar{width:3px;}
.mp-playlist::-webkit-scrollbar-thumb{background:rgba(0,255,136,0.2);border-radius:10px;}
.mp-track{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:.25s;border:1px solid transparent;}
.mp-track:hover{background:rgba(0,255,136,0.05);border-color:rgba(0,255,136,0.1);}
.mp-track.active{background:rgba(0,255,136,0.08);border-color:rgba(0,255,136,0.22);}
.mp-track-num{font-family:'Space Mono',monospace;font-size:9px;color:var(--dim);width:14px;text-align:center;flex-shrink:0;}
.mp-track.active .mp-track-num{color:var(--g);}
.mp-track-info{flex:1;min-width:0;}
.mp-track-name{font-size:11px;font-weight:700;color:rgba(255,255,255,0.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mp-track.active .mp-track-name{color:#fff;}
.mp-track-dur{font-family:'Space Mono',monospace;font-size:9px;color:var(--dim);flex-shrink:0;}
.mp-track-eq{display:none;align-items:flex-end;gap:1px;height:10px;flex-shrink:0;}
.mp-track.active .mp-track-eq{display:flex;}
.mp-track.active .mp-track-num{display:none;}
.eq-bar{width:2px;background:var(--g);border-radius:1px;}
.eq-bar:nth-child(1){animation:bar1 .5s ease infinite;}
.eq-bar:nth-child(2){animation:bar2 .7s ease infinite .1s;}
.eq-bar:nth-child(3){animation:bar1 .6s ease infinite .2s;}

/* ===== COLOR BOX ===== */
.color-box{position:relative;flex-shrink:0;}
.color-box-btn{width:36px;height:36px;border-radius:10px;background:rgba(0,255,136,0.06);border:1px solid rgba(0,255,136,0.2);display:flex;justify-content:center;align-items:center;cursor:pointer;transition:.3s;}
.color-box-btn:hover{background:rgba(0,255,136,0.12);border-color:rgba(0,255,136,0.4);}
.color-dot-spin{width:16px;height:16px;border-radius:50%;background:conic-gradient(#ff6b6b 0deg,#ffd93d 60deg,#00ff88 120deg,#74b9ff 180deg,#b388ff 240deg,#ff80ab 300deg,#ff6b6b 360deg);animation:spinSlow 4s linear infinite;}
@keyframes spinSlow{from{transform:rotate(0);}to{transform:rotate(360deg);}}
.color-panel{position:absolute;top:calc(100% + 8px);right:0;background:rgba(3,15,8,0.97);border:1px solid rgba(0,255,136,0.18);border-radius:14px;padding:14px;width:172px;backdrop-filter:blur(20px);box-shadow:0 16px 48px rgba(0,0,0,0.65);z-index:1100;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);transition:.25s cubic-bezier(.25,.46,.45,.94);pointer-events:none;}
.color-panel.open{opacity:1;visibility:visible;transform:translateY(0) scale(1);pointer-events:all;}
.cp-label{font-family:'Space Mono',monospace;font-size:8px;color:var(--dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
.cp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.cp-dot{width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.2s;position:relative;}
.cp-dot:hover{transform:scale(1.2);}
.cp-dot.active{border-color:#fff;box-shadow:0 0 8px currentColor;}
.cp-dot::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#000;font-weight:900;opacity:0;transition:.15s;}
.cp-dot.active::after{opacity:1;}

/* ===== MOBILE MENU ===== */
.mobile-menu{position:fixed;top:0;right:-100%;width:280px;height:100vh;background:rgba(2,10,5,0.98);border-left:1px solid rgba(0,255,136,0.12);z-index:2000;padding:80px 28px 40px;transition:.45s cubic-bezier(.23,1,.32,1);display:flex;flex-direction:column;gap:4px;overflow-y:auto;backdrop-filter:blur(28px);}
.mobile-menu.active{right:0;box-shadow:-20px 0 60px rgba(0,0,0,0.7);}
.mobile-menu a{color:rgba(255,255,255,0.75);text-decoration:none;font-size:15px;font-weight:700;letter-spacing:1px;padding:14px 12px;border-radius:10px;transition:.3s;display:flex;align-items:center;gap:12px;}
.mobile-menu a:hover{color:var(--g);background:rgba(0,255,136,0.06);}
.mobile-menu a i{color:var(--g);font-size:14px;width:16px;text-align:center;}
.close-btn{position:absolute;top:20px;right:20px;font-size:18px;cursor:pointer;color:var(--g);width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:rgba(0,255,136,0.08);border-radius:10px;border:1px solid rgba(0,255,136,0.2);transition:.3s;}
.close-btn:hover{background:rgba(0,255,136,0.15);}
.menu-admin-btn{margin-top:12px;padding:12px 16px;background:linear-gradient(135deg,rgba(0,255,136,0.12),rgba(0,200,83,0.06));border:1px solid rgba(0,255,136,0.3);border-radius:12px;color:var(--g);font-size:13px;font-weight:700;cursor:pointer;display:none;align-items:center;gap:10px;letter-spacing:1px;transition:.3s;}
.menu-admin-btn:hover{background:rgba(0,255,136,0.2);}
.menu-admin-btn.visible{display:flex;}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1999;opacity:0;visibility:hidden;transition:.3s;backdrop-filter:blur(4px);}
.menu-overlay.active{opacity:1;visibility:visible;}

/* ===== HERO ===== */
.hero{min-height:100vh;padding:clamp(95px,14vw,130px) 5% clamp(55px,8vw,80px);display:flex;justify-content:center;align-items:center;gap:clamp(30px,5vw,60px);flex-wrap:wrap-reverse;position:relative;overflow:hidden;}
.hero-left{flex:1;min-width:280px;max-width:560px;}
.avail-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:50px;background:rgba(0,255,136,0.06);border:1px solid rgba(0,255,136,0.2);font-size:10px;font-weight:700;color:var(--g);letter-spacing:2px;text-transform:uppercase;margin-bottom:22px;opacity:0;animation:up .7s ease 2.3s both;}
.avail-dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:dotBlink 1.5s infinite;}
.hero-eyebrow{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:4px;text-transform:uppercase;margin-bottom:12px;opacity:0;animation:up .7s ease 2.45s both;}
.hero-title{font-family:'Orbitron',monospace;font-size:clamp(38px,8.5vw,78px);font-weight:900;line-height:.95;margin-bottom:18px;opacity:0;animation:up .8s ease 2.6s both;}
.hero-title .line1{display:block;color:rgba(255,255,255,0.15);font-size:clamp(11px,2.2vw,17px);letter-spacing:5px;font-family:'Space Mono',monospace;margin-bottom:8px;}
.hero-title .gname{display:block;background:linear-gradient(135deg,var(--g) 0%,#a8ffcd 50%,var(--g3) 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s linear infinite;filter:drop-shadow(0 0 20px rgba(0,255,136,0.4));}
.middle-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 0 22px;opacity:0;animation:up .7s ease 2.75s both;}
.m-word{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.3);padding:5px 11px;border:1px solid rgba(255,255,255,0.07);border-radius:6px;}
.m-word.accent{color:var(--g);border-color:rgba(0,255,136,0.25);background:rgba(0,255,136,0.04);}
.m-sep{color:rgba(255,255,255,0.1);font-size:13px;}
.hero-desc{max-width:460px;color:var(--dim);line-height:1.85;font-size:14px;margin-bottom:28px;opacity:0;animation:up .7s ease 2.9s both;}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;opacity:0;animation:up .7s ease 3s both;}
.btn-p{padding:14px 28px;border-radius:10px;background:linear-gradient(135deg,var(--g),var(--g3));color:#020c07;font-weight:800;font-size:13px;text-decoration:none;letter-spacing:1px;transition:.4s;border:none;cursor:pointer;font-family:'Syne',sans-serif;box-shadow:0 0 24px rgba(0,255,136,0.22);}
.btn-p:hover{transform:translateY(-4px);box-shadow:0 0 44px rgba(0,255,136,0.4);}
.btn-s{padding:14px 28px;border-radius:10px;background:transparent;color:var(--g);border:1px solid rgba(0,255,136,0.3);font-weight:700;font-size:13px;letter-spacing:1px;text-decoration:none;transition:.4s;font-family:'Syne',sans-serif;}
.btn-s:hover{background:rgba(0,255,136,0.07);transform:translateY(-4px);border-color:var(--g);}
.hero-social{display:flex;gap:9px;margin-top:22px;opacity:0;animation:up .7s ease 3.2s both;flex-wrap:wrap;}
.hero-social a{width:42px;height:42px;border-radius:10px;display:flex;justify-content:center;align-items:center;background:rgba(0,255,136,0.04);border:1px solid var(--border);color:var(--dim);text-decoration:none;font-size:14px;transition:.4s;}
.hero-social a:hover{background:rgba(0,255,136,0.1);color:var(--g);transform:translateY(-4px);border-color:rgba(0,255,136,0.3);}

/* HERO RIGHT */
.hero-right{flex:1;min-width:260px;max-width:430px;display:flex;justify-content:center;align-items:center;position:relative;padding:60px 80px;perspective:1400px;opacity:0;animation:fadeIn 1s ease 2.5s both;}
.photo-glow-ring{position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,136,0.28) 0%,rgba(0,200,83,0.12) 40%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);filter:blur(55px);z-index:0;animation:gRing 4s ease infinite;}
.photo-glow-ring2{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,136,0.18) 0%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%);filter:blur(30px);z-index:0;animation:gRing 5s ease infinite .8s;}
@keyframes gRing{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1);}50%{opacity:1;trans
